<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 一起听</title>
<style>
  :root {
    --bg0:#eef1f8; --bg1:#f7f8fc;
    --ink:#1c2233; --ink-dim:#67718a;
    --card: rgba(255,255,255,.72);
    --stroke: rgba(255,255,255,.9);
    --accent:#3f6fd6; --accent2:#7b5cff; --pink:#c44ad6;
    --gold:#f59e0b; --gold-txt:#b45309;
    --r-lg:26px; --r-md:18px; --r-sm:14px;
    --shadow: 0 12px 32px rgba(63,80,140,.16);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
    overflow-y:auto; -webkit-user-select:none; user-select:none;
    letter-spacing:.1px;
  }
  #bg {
    position: fixed; inset:0; z-index:-2;
    background:
      radial-gradient(680px 520px at 88% -8%, rgba(120,160,255,.5), transparent 68%),
      radial-gradient(600px 460px at -12% 26%, rgba(200,170,255,.42), transparent 70%),
      radial-gradient(520px 420px at 100% 88%, rgba(255,190,225,.4), transparent 72%),
      radial-gradient(480px 380px at 12% 100%, rgba(160,225,255,.4), transparent 70%),
      linear-gradient(168deg, var(--bg1) 0%, var(--bg0) 52%, #e9edf7 100%);
  }

  /* ===== 平面白卡片（液态玻璃只用于控件，全部来自开源项目 GooseHyperGlass
        https://glass.goose.cc.cd · MIT · 纯 WebGL 真折射，非 backdrop-filter blur 毛玻璃） ===== */
  .glass {
    background: var(--card);
    backdrop-filter: saturate(165%);
    -webkit-backdrop-filter: saturate(165%);
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .wrap { padding: 12px 16px 30px; display:flex; flex-direction:column; gap:14px; }
  svg { display:block; }

  #topbar { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r-lg); }
  .iconbtn {
    width:40px; height:40px; border-radius:50%; flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--ink);
    background: rgba(255,255,255,.85); border:1px solid var(--stroke);
    box-shadow: 0 4px 12px rgba(63,80,140,.12);
    transition: transform .12s ease, filter .12s ease;
  }
  .iconbtn:active { transform:scale(.92); filter:brightness(.97); }
  #ttl { flex:1; min-width:0; }
  #ttl h1 { font-size:17px; font-weight:700; letter-spacing:.2px; }
  #ttl p { font-size:12px; color:var(--ink-dim); margin-top:2px; }

  #player { padding:18px; }
  #prow { display:flex; align-items:center; gap:16px; }
  #cover {
    width:64px; height:64px; border-radius:20px; flex-shrink:0; color:rgba(255,255,255,.95);
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#3f6fd6,#7b5cff 52%,#c44ad6);
    box-shadow: 0 10px 22px rgba(100,110,255,.32), inset 0 1px 0 rgba(255,255,255,.4);
  }
  #meta { flex:1; min-width:0; }
  #name { display:flex; align-items:center; gap:8px; }
  #songname { font-size:16px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #artist { font-size:12.5px; color:var(--ink-dim); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #note { font-size:11.5px; color:var(--ink-dim); margin-top:3px; }
  .vip {
    font-size:10px; font-weight:800; color:var(--gold-txt); flex-shrink:0;
    background: linear-gradient(135deg, rgba(245,158,11,.18), rgba(255,180,60,.16));
    border:1px solid rgba(245,158,11,.45);
    padding:2px 7px; border-radius:999px; letter-spacing:.4px;
  }
  #prog { margin-top:16px; }
  .slider-box { position:relative; height:46px; border-radius:999px; }
  #seekLg { position:absolute; inset:0; width:100%; height:100%; }
  #seekFb {
    display:none; position:absolute; inset:0; width:100%; height:100%;
    -webkit-appearance:none; appearance:none; background:transparent; outline:none;
  }
  #seekFb::-webkit-slider-runnable-track { height:7px; border-radius:999px; background: rgba(63,111,214,.18); }
  #seekFb::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:#fff; margin-top:-5.5px; box-shadow: 0 2px 8px rgba(63,80,140,.35); }
  #ptime { display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-dim); margin-top:-4px;
    font-variant-numeric: tabular-nums; }
  #pctrl { display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  #turnLabel { font-size:12px; color:var(--ink-dim); }
  #pbtns { display:flex; gap:14px; align-items:center; }
  .pbtn-wrap { position:relative; width:46px; height:46px; border-radius:50%; flex-shrink:0; }
  .pbtn-wrap.main-wrap { width:60px; height:60px; }
  .pbtn-wrap liquid-glass { position:absolute; inset:0; width:100%; height:100%; }
  .pbtn-wrap .pbtn { position:absolute; inset:0; }
  .search-btn-wrap { position:relative; width:40px; height:40px; border-radius:50%; flex-shrink:0; }
  .search-btn-wrap liquid-glass { position:absolute; inset:0; width:100%; height:100%; }
  .search-btn-wrap .iconbtn { position:absolute; inset:0; }
  .pbtn {
    width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink);
    background: rgba(255,255,255,.9); border:1px solid var(--stroke);
    box-shadow: 0 4px 12px rgba(63,80,140,.14);
    transition: transform .12s ease, filter .12s ease;
  }
  .pbtn:active { transform:scale(.9); filter:brightness(.97); }
  .pbtn.main {
    width:60px; height:60px;
    background: linear-gradient(135deg,#3f6fd6,#7b5cff 60%,#c44ad6); color:#fff;
    border:none;
    box-shadow: 0 8px 20px rgba(100,110,255,.4);
  }

  #turn { padding:12px 16px; border-radius:22px; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #turnText { min-width:0; }
  #switches { display:flex; gap:10px; flex-shrink:0; align-items:center; }
  .sw-wrap { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-dim); font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none; }
  .sw-wrap.on { color:var(--gold); }
  .sw-wrap .sw-lbl { transition: color .2s; }
  /* 音效混音台 */
  #eqbar { margin:10px 14px 0; padding:10px 12px; }
  .eq-head { display:flex; align-items:center; gap:10px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .eq-title { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--ink); }
  .eq-presets { display:flex; gap:6px; flex:1; overflow-x:auto; }
  .eq-chip { padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600; color:var(--ink-dim); background:rgba(255,255,255,.25); border:1px solid rgba(255,255,255,.35); cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
  .eq-chip.on { color:#fff; background:rgba(61,139,255,.55); border-color:transparent; }
  .eq-caret { color:var(--ink-dim); font-size:12px; transition:transform .25s; }
  #eqBody { display:none; margin-top:10px; }
  #eqBody.open { display:block; }
  .eq-row { display:flex; align-items:center; gap:10px; margin:7px 0; font-size:12px; color:var(--ink-dim); }
  .eq-lbl { width:64px; flex-shrink:0; font-weight:600; }
  .eq-slider { flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; background:rgba(255,255,255,.35); outline:none; }
  .eq-slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:linear-gradient(160deg,#7fd0ff,#3d8bff); box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .eq-row b { width:26px; text-align:right; font-variant-numeric:tabular-nums; }
  .eq-beat { font-size:12px; }
  .eq-beat input { accent-color:#3d8bff; }
  .eq-note { font-size:10.5px; color:var(--ink-dim); opacity:.75; margin-top:8px; line-height:1.5; }
  .sw-box { position:relative; width:58px; height:34px; border-radius:999px; }
  .sw-lg { position:absolute; inset:0; width:100%; height:100%; }
  .sw-fb { display:none; position:absolute; inset:0; width:100%; height:100%; }

  #searchbar { display:flex; align-items:center; gap:10px; padding:6px 8px 6px 16px; border-radius:999px; }
  #q { flex:1; background:transparent; border:none; outline:none; color:var(--ink);
    font-size:15px; padding:9px 0; min-width:0; font-family:inherit; }
  #q::placeholder { color: rgba(103,113,138,.55); }
  #srcrow { display:flex; gap:8px; align-items:center; }
  #searching { font-size:12px; color:var(--ink-dim); margin-left:4px; }
  #results { display:flex; flex-direction:column; gap:8px; }
  .res {
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r-md); cursor:pointer;
    background: rgba(255,255,255,.85); border:1px solid var(--stroke);
    box-shadow: 0 4px 14px rgba(63,80,140,.1);
    transition: transform .12s ease, background .15s ease;
  }
  .res:active { transform:scale(.98); background:#fff; }
  .res .ricon { color:var(--accent); flex-shrink:0; }
  .res.vip .ricon { color:var(--gold); }
  .res .rn { flex:1; min-width:0; }
  .res .rn b { display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600;
    overflow:hidden; }
  .res .rn b > span.t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .res .rn i { display:block; font-size:11.5px; color:var(--ink-dim); font-style:normal; margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric: tabular-nums; }

  .sec { font-size:12px; color:var(--ink-dim); margin-bottom:-6px; padding-left:4px; letter-spacing:.3px; }
  #log { display:flex; flex-direction:column; gap:8px; max-height:250px; overflow-y:auto; padding:12px; }
  .msg { display:flex; gap:7px; }
  .msg.ai { justify-content:flex-start; }
  .msg.me { justify-content:flex-end; }
  .msg .bubble {
    max-width:78%; padding:10px 14px; border-radius:18px; font-size:13.5px; line-height:1.5;
    background: rgba(255,255,255,.92); border:1px solid var(--stroke);
    box-shadow: 0 3px 10px rgba(63,80,140,.08);
  }
  .msg.me .bubble {
    background: linear-gradient(135deg, rgba(63,111,214,.9), rgba(123,92,255,.88));
    color:#fff; border:none;
    border-radius:18px 18px 6px 18px;
  }
  .msg.ai .bubble { border-radius:18px 18px 18px 6px; }
  .empty { font-size:12.5px; color:var(--ink-dim); padding:8px 4px; line-height:1.6; }

  #queue { display:flex; flex-direction:column; gap:8px; padding:10px; }
  .qrow { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--r-sm);
    background: rgba(255,255,255,.8); border:1px solid transparent; font-size:13px;
    transition: background .15s ease, border-color .15s ease; }
  .qrow.cur { background: rgba(63,111,214,.14); border-color: rgba(63,111,214,.35); }
  .tag { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; flex-shrink:0; letter-spacing:.3px; }
  .tag.me { background: rgba(63,111,214,.16); color:#2f5fc0; }
  .tag.ai { background: rgba(245,158,11,.18); color:var(--gold-txt); }
  .qrow .qn { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qstate { font-size:11px; color:var(--ink-dim); flex-shrink:0; }
  .qrow.cur .qstate { color:var(--accent); }

  #chatbar { display:flex; align-items:center; gap:8px; padding:6px 8px 6px 18px; border-radius:999px; }
  #cmsg { flex:1; background:transparent; border:none; outline:none; color:var(--ink);
    font-size:15px; padding:10px 0; min-width:0; font-family:inherit; }
  #cmsg::placeholder { color: rgba(103,113,138,.55); }
  #send-wrap { position:relative; width:46px; height:46px; border-radius:50%; flex-shrink:0; }
  #sendLg { position:absolute; inset:0; width:100%; height:100%; }
  #send {
    display:none; position:absolute; inset:0; width:100%; height:100%; border-radius:50%;
    align-items:center; justify-content:center; cursor:pointer; color:#fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border:none; box-shadow: 0 6px 16px rgba(80,110,255,.4);
  }
  .busy { opacity:.4; pointer-events:none; }
  .loading { opacity:.6; font-size:12px; padding:4px 2px; }

  /* WebGL2 不可用 → 显示原生控件，隐藏液态玻璃控件 */
  html.no-lg2 #seekLg, html.no-lg2 .sw-lg, html.no-lg2 #sendLg,
  html.no-lg2 .pbtn-wrap liquid-glass, html.no-lg2 .search-btn-wrap liquid-glass { display:none; }
  html.no-lg2 #seekFb, html.no-lg2 .sw-fb, html.no-lg2 #send { display:flex; }
  html.no-lg2 .pbtn-wrap .pbtn, html.no-lg2 .search-btn-wrap .iconbtn { position:static; }

  #bgLight {
    position: fixed; inset:0; z-index:-1; pointer-events:none;
    background-size: cover; background-position: center;
    opacity:.32; filter: saturate(1.25);
  }

  ::-webkit-scrollbar { width:0; height:0; }
</style>
</head>
<body>
<!-- WebGL2 探测：支持才加载 GooseHyperGlass 液态玻璃库，否则启用原生控件降级 -->
<script>
  (function () {
    var ok = false;
    try { ok = !!(window.WebGL2RenderingContext && document.createElement('canvas').getContext('webgl2')); }
    catch (e) { ok = false; }
    window.__lgOk = ok;
    if (!ok) document.documentElement.classList.add('no-lg2');
    else document.write('<script src="goose-glass.js"><\/script>');
  })();
</script>

<div id="bg"></div>
<div id="bgLight"></div>

<div class="wrap">
  <!-- 顶栏 -->
  <div id="topbar" class="glass">
    <div class="iconbtn" id="back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div id="ttl">
      <h1>AI 一起听</h1>
      <p id="sub">轮流点歌 · 酷狗 / 网易云</p>
    </div>
  </div>

  <!-- 播放器 -->
  <div id="player" class="glass">
    <div id="prow">
      <div id="cover">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div id="meta">
        <div id="name"><span id="songname">还没有在放歌</span></div>
        <div id="artist">AI 正在点今天的第一首歌…</div>
        <div id="note"></div>
      </div>
    </div>
    <div id="prog">
      <div class="slider-box">
        <liquid-glass id="seekLg" mode="single-slider"  dpr="1.2"></liquid-glass>
        <input id="seekFb" type="range" min="0" max="100" value="0">
      </div>
      <div id="ptime"><span id="tnow">0:00</span><span id="ttotal">0:00</span></div>
    </div>
    <div id="pctrl">
      <span id="turnLabel"></span>
      <div id="pbtns">
        <div class="pbtn-wrap">
          <div class="pbtn" id="prev">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6l-10 6 10 6z"/></svg>
          </div>
          <liquid-glass id="prevLg" mode="buttons" dpr="1.2"></liquid-glass>
        </div>
        <div class="pbtn-wrap main-wrap">
          <div class="pbtn main" id="play"></div>
          <liquid-glass id="playLg" mode="buttons" dpr="1.2"></liquid-glass>
        </div>
        <div class="pbtn-wrap">
          <div class="pbtn" id="next">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l10 6-10 6z"/></svg>
          </div>
          <liquid-glass id="nextLg" mode="buttons" dpr="1.2"></liquid-glass>
        </div>
      </div>
    </div>
  </div>

  <!-- 排除 VIP（液态玻璃开关） -->
  <div id="turn" class="glass">
    <span id="turnText">轮到你了，搜一首点吧</span>
    <span id="switches">
      <span class="sw-wrap" id="swUser" onclick="toggleExclude('user')">
        <span class="sw-box">
          <liquid-glass id="exUserLg" class="sw-lg" mode="single-toggle"  dpr="1.2"></liquid-glass>
          <span class="sw-fb"></span>
        </span>
        <span class="sw-lbl">排除VIP</span>
      </span>
      <span class="sw-wrap" id="swAi" onclick="toggleExclude('ai')">
        <span class="sw-box">
          <liquid-glass id="exAiLg" class="sw-lg" mode="single-toggle"  dpr="1.2"></liquid-glass>
          <span class="sw-fb"></span>
        </span>
        <span class="sw-lbl">AI排除VIP</span>
      </span>
    </span>
  </div>

  <!-- 搜索 -->
  <div id="searchbar" class="glass">
    <input id="q" placeholder="搜索歌曲…" type="text">
    <div class="search-btn-wrap">
      <div class="iconbtn" id="doSearch">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </div>
      <liquid-glass id="searchLg" mode="buttons" dpr="1.2"></liquid-glass>
    </div>
  </div>
  <div id="srcrow">
    <span class="chip" id="srcKugou">酷狗</span>
    <span class="chip" id="srcNetease">网易云</span>
    <span id="searching" class="loading" style="display:none;">搜索中…</span>
  </div>
  <div id="results"></div>

  <!-- 音效设置（液态玻璃混音台） -->
  <div id="eqbar" class="glass">
    <div class="eq-head">
      <span class="eq-title" onclick="document.getElementById('eqBody').classList.toggle('open')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M6 12h12M9 18h6"/><circle cx="6" cy="6" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg> 音效</span>
      <span class="eq-presets">
        <span class="chip eq-chip" id="eqOrig">原声</span>
        <span class="chip eq-chip" id="eqD3">3D立体</span>
        <span class="chip eq-chip" id="eqSur">3D环绕</span>
        <span class="chip eq-chip" id="eqPhone">耳机</span>
      </span>
      <span class="eq-caret" onclick="document.getElementById('eqBody').classList.toggle('open')">▾</span>
    </div>
    <div id="eqBody">
      <div class="eq-row"><span class="eq-lbl">低音</span><input class="eq-slider" id="eqLow" type="range" min="-12" max="12" value="0"><b id="eqLowV">0</b></div>
      <div class="eq-row"><span class="eq-lbl">中音</span><input class="eq-slider" id="eqMid" type="range" min="-12" max="12" value="0"><b id="eqMidV">0</b></div>
      <div class="eq-row"><span class="eq-lbl">高音</span><input class="eq-slider" id="eqHigh" type="range" min="-12" max="12" value="0"><b id="eqHighV">0</b></div>
      <div class="eq-row"><span class="eq-lbl">混响</span><input class="eq-slider" id="eqReverb" type="range" min="0" max="100" value="0"><b id="eqReverbV">0</b></div>
      <div class="eq-row"><span class="eq-lbl">3D深度</span><input class="eq-slider" id="eq3d" type="range" min="0" max="100" value="0"><b id="eq3dV">0</b></div>
      <div class="eq-row"><span class="eq-lbl">湿音/干音</span><input class="eq-slider" id="eqWet" type="range" min="0" max="100" value="20"><b id="eqWetV">20</b></div>
      <div class="eq-note">预设：3D立体 / 3D环绕（声场旋转）/ 耳机（虚拟声场）。安卓 12 以下玻璃可能变透明，音效不受影响。</div>
    </div>
  </div>

  <!-- 点歌对话 -->
  <div class="sec">点歌对话</div>
  <div id="log" class="glass"><div class="empty">你点一首、AI 点一首，播放进度每 20 秒汇报给 AI。</div></div>

  <!-- 队列 -->
  <div class="sec">播放队列</div>
  <div id="queue" class="glass"></div>

  <!-- 聊天输入（液态玻璃发送键） -->
  <div id="chatbar" class="glass">
    <input id="cmsg" placeholder="和 AI 聊聊这首歌…" type="text">
    <div id="send-wrap">

/* ================= 工具 ================= */
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(ms){
  if(!ms || ms <= 0) return "0:00";
  var s = Math.floor(ms/1000);
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
async function chatOnce(messages, maxTokens){
  // 独立超时：直连 18s，本地转发 25s，失败立即返回明确信息，绝不无限转圈
  var ctrl1 = new AbortController();
  var t1 = setTimeout(function(){ try{ ctrl1.abort(); }catch(e){} }, 18000);
  try {
    var cfg = window.__LQ_CFG || {};
    var useDirect = cfg.key && cfg.url;
    if(useDirect){
      try {
        var base = String(cfg.url).replace(/\/+$/,"");
        if(base.indexOf("/v1") < 0) base += "/v1";
        var res = await fetch(base + "/chat/completions", {
          method:"POST",
          headers: { "Content-Type":"application/json", "Authorization":"Bearer " + cfg.key },
          body: JSON.stringify({ model: cfg.model, messages: messages, max_tokens: maxTokens || 120, stream:false }),
          signal: ctrl1.signal
        });
        if(res.ok){
          var rj = await res.json();
          var reply = (rj.choices && rj.choices[0] && rj.choices[0].message && rj.choices[0].message.content) || "";
          if(reply) return reply;
        } else {
          var errj = await res.json().catch(function(){ return {}; });
          throw new Error((errj.error && errj.error.message) || ("HTTP " + res.status));
        }
      } catch(e){
        if(e.name === "AbortError") throw new Error("回复超时：模型响应太慢或网络不稳定，稍后再试");
      }
    }
    // 本地转发兜底（独立超时，不被直连的 abort 影响）
    var ctrl2 = new AbortController();
    var t2 = setTimeout(function(){ try{ ctrl2.abort(); }catch(e){} }, 25000);
    try {
      var res2 = await fetch("/api/chat", {
        method:"POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ messages: messages, maxTokens: maxTokens || 120 }),
        signal: ctrl2.signal
      });
      var j2 = await res2.json();
      if(j2.error) throw new Error(friendlyErr(j2.error));
      return j2.reply || "";
    } catch(e){
      if(e.name === "AbortError") throw new Error("回复超时：模型响应太慢或网络不稳定，稍后再试");
      throw e;
    } finally { clearTimeout(t2); }
  } finally { clearTimeout(t1); }
}
function friendlyErr(s){
  s = String(s || "");
  if(/timed out|timeout/i.test(s)) return "回复超时：模型响应太慢或网络不稳定，稍后再试";
  if(/尚未配置/.test(s)) return s;
  return s;
}

/* ================= 音乐接口（应用内本地服务器代理：无 CORS / 防盗链） ================= */
async function searchKugou(kw, limit){
  var res = await fetch("/api/search?q=" + encodeURIComponent(kw) + "&source=kugou&limit=" + (limit || 30));
  var j = await res.json();
  if(j.error) throw new Error(j.error);
  return j.list || [];
}
async function searchNetease(kw, limit){
  var res = await fetch("/api/search?q=" + encodeURIComponent(kw) + "&source=netease&limit=" + (limit || 30));
  var j = await res.json();
  if(j.error) throw new Error(j.error);
  return j.list || [];
}
async function kugouUrl(hash, albumId){
  var res = await fetch("/api/resolve?token=" + encodeURIComponent(hash) + "&source=kugou&album_id=" + encodeURIComponent(albumId || "0"));
  var j = await res.json();
  if(!j.url) throw new Error(j.error || "无法获取播放地址（可能为 VIP/付费）");
  return j.url;
}
async function neteaseUrl(id){
  var res = await fetch("/api/resolve?token=" + encodeURIComponent(id) + "&source=netease");
  var j = await res.json();
  if(!j.url) throw new Error(j.error || "无法获取播放地址（可能为 VIP/付费或需登录）");
  return j.url;
}

}

/* ================= 播放（一首一首，播完才轮换） ================= */
function playAt(idx){
  if(idx < 0 || idx >= queue.length) return;
  currentIdx = idx;
  var q = queue[idx];
  renderPlayer(); renderQueue();
  if(q.state === "failed") return;
  var t = q.track;
  notice("解析播放地址…");
  resolveUrl(t).then(function(url){
    q.track.playUrl = url;
    q.state = "playing";
    playing = true;
    setTurn();
    audio.src = url;
    audio.play().then(function(){
      renderPlayer(); renderQueue(); renderFill();
      reportNow();
    }).catch(function(e){
      q.state = "failed"; renderPlayer(); renderQueue();
      notice("播放失败：" + (e && e.message ? e.message : "未知错误"));
      setTimeout(function(){ nextTurn(); }, 1200);
    });
  }).catch(function(e){
    q.state = "failed";
    renderPlayer(); renderQueue();
    notice("播放失败：" + (e && e.message ? e.message : "未知错误"));
    setTimeout(function(){ nextTurn(); }, 1200);
  });
}
function enqueue(t, by){

}
function nextTurn(){
  audio.pause();

  queue = []; currentIdx = -1;
  playing = false;
  lastReport = -1;
  renderPlayer(); renderQueue(); renderFill();
  if (turn === "user") { turn = "ai"; setTurn(); aiPick(); }
  else { turn = "user"; setTurn(); notice("轮到你了，搜一首点吧"); }
}

function audioFailMsg(){
  var src = audio.currentSrc || audio.src || "";
  if(src.indexOf("/api/audio") < 0) return "无法加载音频（可能是网络问题）";
  return new Promise(function(res){
    var x = new XMLHttpRequest();
    try { x.open("GET", src, true); } catch(e){ res("无法获取音频流"); return; }
    x.onreadystatechange = function(){
      if(x.readyState >= 2){
        // 只读响应头与前部内容（错误 JSON 很小），立即中止，不拉完整音频流
        var t = "";
        try { t = x.responseText || ""; } catch(e){}
        x.abort();
        var err = "";
        try { err = JSON.parse(t).error || ""; } catch(e){ err = ""; }
        res(err || "无法获取音频流（可能为 VIP/需登录或版权受限）");
      }
    };
    x.onerror = function(){ res("无法连接音频服务"); };
    x.send();
  });
}

function aiPick(){
  if(aiPicking || aiBusy || playing) return;
  if(turn !== "ai") return;                 // 严格轮换：没轮到 AI 不点
  aiPicking = true; setTurn();
  addLog("ai", "AI 正在点歌…");
  var last = queue[currentIdx] && queue[currentIdx].track;
  var sys = "你是「" + CONFIG.characterName + "」，角色设定：" + (CONFIG.persona || "活泼温暖的音乐伙伴") + "。你是 AI 一起听点歌员，正在和用户玩「轮流点歌」：用户点一首，你点一首。\n" +
    "规则：轮到你时，只回复一首歌，格式严格为：歌名-歌手（例如：晴天-周杰伦），不要任何多余文字。\n" +
    (excludeVipAi ? "你被要求排除 VIP 歌曲：只选免费可播的歌曲。\n" : "");
  var usr = "轮到你点歌了。" + (last ? "上一首播放的是《" + last.name + "》- " + (last.artist||"未知歌手") + (last.isVip ? "（VIP 歌曲）" : "（免费歌曲）") + "。" : "") + "请点一首歌（格式：歌名-歌手）";
  chatOnce([{ role:"system", content:sys }, { role:"user", content:usr }], 60).then(function(reply){
    reply = (reply||"").trim();
    var m = reply.match(/^(?:《)?([^《》\-—–\s]+(?:[^《》\-—–]*[^《》\-—–\s])?)[-—–]\s*(.+)$/);
    var namePart, artistPart;
    if(m){ namePart = m[1]; artistPart = m[2]; }
    else if(reply.indexOf("-") > 0){ var sp = reply.split("-"); namePart = sp[0].trim(); artistPart = sp.slice(1).join("-").trim(); }
    else { addLog("ai", reply); notice("AI 回复格式不对，已自动跳过，轮到你了"); aiPicking = false; setTurn(); turn = "user"; return; }
    return searchPlay(namePart + " " + artistPart, true, namePart);
  }).then(function(){ aiPicking = false; setTurn(); })
    .catch(function(e){
      addLog("ai", "AI 点歌失败（" + (e && e.message ? e.message : "未知错误") + "），已自动跳过，轮到你了");
      aiPicking = false; setTurn(); turn = "user";
    });
}
async function searchPlay(kw, isAi, preferName){

    else notice("搜索无结果");
    return;
  }
  if(isAi){
    var c = preferName ? list.find(function(t){ return t.name.indexOf(preferName) >= 0; }) : null;
    if(!c) c = list[0];
    if(excludeVipAi){ c = list.find(function(t){ return !t.isVip; }) || c; }
    addLog("ai", "AI 点了：《" + c.name + "》- " + (c.artist||"未知歌手") + (c.isVip ? "（VIP 歌曲）" : "（免费歌曲）"));

}

/* ================= 音效引擎（Web Audio：EQ / 混响 / 3D 声场） ================= */
/* 关键：音频链必须保证 master → destination 永远连通，且 AudioContext 立即 resume，
   否则 createMediaElementSource 接管后 audio 元素会"在播但无声" */
var actx = null, eqN = {}, eqState = { low:0, mid:0, high:0, reverb:0, d3:0, wet:20 };
function makeImpulse(seconds, decay){
  var rate = actx.sampleRate, len = rate * seconds, buf = actx.createBuffer(2, len, rate);
  for(var c=0;c<2;c++){
    var d = buf.getChannelData(c);
    for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
  }
  return buf;
}
/* 惰性接管：默认 audio 直连扬声器保证有声；用户开音效时才接管进音频链 */
function ensureAudioGraph(){
  if(actx){
    if(actx.state === "suspended") actx.resume();   // 用户手势内恢复，防无声
    return true;
  }
  if(!audio || !audio.src) return false;
  initAudioGraph();
  if(actx && actx.state === "suspended") actx.resume();
  return !!actx;
}
function initAudioGraph(){
  if(actx) return;
  try {
    actx = new (window.AudioContext||window.webkitAudioContext)();
    var src = actx.createMediaElementSource(audio);
    eqN.low  = actx.createBiquadFilter(); eqN.low.type = "lowshelf"; eqN.low.frequency.value = 200;
    eqN.mid  = actx.createBiquadFilter(); eqN.mid.type = "peaking"; eqN.mid.frequency.value = 1000; eqN.mid.Q.value = 0.8;
    eqN.high = actx.createBiquadFilter(); eqN.high.type = "highshelf"; eqN.high.frequency.value = 8000;
    eqN.conv = actx.createConvolver(); eqN.conv.buffer = makeImpulse(2.6, 2.2);
    eqN.pan  = actx.createStereoPanner();
    eqN.dry  = actx.createGain(); eqN.wet = actx.createGain();
    eqN.master = actx.createGain(); eqN.master.gain.value = 1;
    // 主链：src -> EQ -> pan -> dry/wet -> master -> destination（永远连通）
    src.connect(eqN.low); eqN.low.connect(eqN.mid); eqN.mid.connect(eqN.high);
    eqN.high.connect(eqN.pan);
    eqN.pan.connect(eqN.dry); eqN.dry.connect(eqN.master);
    eqN.pan.connect(eqN.conv); eqN.conv.connect(eqN.wet); eqN.wet.connect(eqN.master);
    eqN.master.connect(actx.destination);
    // 立即 resume：用户手势内调用，否则浏览器挂起 AudioContext → 无声
    if (actx.state === "suspended") actx.resume();
    setEQ();
  } catch(e){
    /* 接管失败：重置 actx，audio 保持直连（仍出声），音效下次操作自动重试 */
    actx = null; eqN = {};
    console.log("audio graph err", e);
  }
}
function setEQ(){
  if(!actx) return;
  eqN.low.gain.value = eqState.low;
  eqN.mid.gain.value = eqState.mid;
  eqN.high.gain.value = eqState.high;
  var wetLevel = eqState.wet / 100, rev = eqState.reverb / 100;
  eqN.wet.gain.value = wetLevel * rev * 1.4;
  eqN.dry.gain.value = Math.max(0.08, 1 - wetLevel * rev);   // 干声保底 8%，绝不全静音
  eqN.master.gain.value = 1;
}
/* 3D 环绕：StereoPanner LFO 自动摆头（不用 PannerNode，距离模型在 WebView 上易出无声） */
var surroundAngle = 0, surroundOn = false;
(function rotLoop(){
  if(actx && surroundOn){
    surroundAngle += 0.035;
    eqN.pan.pan.value = Math.sin(surroundAngle) * 0.85;      // 左右横摆
  }
  requestAnimationFrame(rotLoop);
})();
function applyPreset(p){
  var s = eqState, el = function(id, v){ var e = document.getElementById(id); if(e) e.value = v; };
  if(p === "orig"){ s.low=s.mid=s.high=s.reverb=s.d3=0; s.wet=20; surroundOn=false; }
  else if(p === "d3"){ s.low=0; s.mid=0; s.high=2; s.reverb=45; s.d3=35; s.wet=40; surroundOn=false; }
  else if(p === "sur"){ s.low=0; s.mid=0; s.high=0; s.reverb=30; s.d3=70; s.wet=30; surroundOn=true; }
  else if(p === "phone"){ s.low=3; s.mid=-1; s.high=2; s.reverb=15; s.d3=0; s.wet=30; surroundOn=false; }
  el("eqLow",s.low); el("eqMid",s.mid); el("eqHigh",s.high); el("eqReverb",s.reverb); el("eq3d",s.d3); el("eqWet",s.wet);
  document.getElementById("eqLowV").textContent=s.low; document.getElementById("eqMidV").textContent=s.mid;
  document.getElementById("eqHighV").textContent=s.high; document.getElementById("eqReverbV").textContent=s.reverb;
  document.getElementById("eq3dV").textContent=s.d3; document.getElementById("eqWetV").textContent=s.wet;
  setEQ();
}
/* 音效控件绑定 */
(function bindEQ(){
  document.getElementById("eqOrig").onclick = function(e){ if(e) e.stopPropagation(); ensureAudioGraph(); applyPreset("orig"); };
  document.getElementById("eqD3").onclick = function(e){ if(e) e.stopPropagation(); ensureAudioGraph(); applyPreset("d3"); };
  document.getElementById("eqSur").onclick = function(e){ if(e) e.stopPropagation(); ensureAudioGraph(); applyPreset("sur"); };
  document.getElementById("eqPhone").onclick = function(e){ if(e) e.stopPropagation(); ensureAudioGraph(); applyPreset("phone"); };
  [["eqLow","eqLowV"],["eqMid","eqMidV"],["eqHigh","eqHighV"],["eqReverb","eqReverbV"],["eq3d","eq3dV"],["eqWet","eqWetV"]].forEach(function(pair){
    var id = pair[0], v = document.getElementById(pair[1]);
    document.getElementById(id).addEventListener("input", function(){
      ensureAudioGraph();
      eqState[id.replace("eq","").toLowerCase()] = parseInt(this.value, 10);
      v.textContent = this.value;
      if(id === "eq3d"){ surroundOn = eqState.d3 >= 40; if(!surroundOn) eqN.pan && (eqN.pan.pan.value = 0); }
      setEQ();
    });
  });
  /* 注意：默认不接管 audio（直连扬声器，保证有声）；接管只发生在用户主动调音效时 */
})();

/* ================= 进入：AI 先点一首（播放中的歌播完才轮换） ================= */
setTurn();
setTimeout(function(){ aiPick(); }, 400);

/* ================= GooseHyperGlass 液态玻璃控件联动（开源项目，纯 WebGL 真折射） ================= */
(function initGlass(){
  if (window.__lgOk !== true) return;
  var seekLg = document.getElementById("seekLg");
  var exUserLg = document.getElementById("exUserLg");
  var exAiLg = document.getElementById("exAiLg");
  var sendLg = document.getElementById("sendLg");
  var seekProg = false;

  /* 玻璃 → 页面 */
  document.addEventListener("lg-statechange", function(e){
    var el = e.target, d = e.detail || {};
    if(!el || !d) return;
    if(d.sliderValue !== undefined && el === seekLg && audio.duration){
      seekProg = true;
      audio.currentTime = audio.duration * (d.sliderValue / 100);
      renderFill();
      setTimeout(function(){ seekProg = false; }, 250);
    }
    if(d.toggleOn !== undefined){
      if(el === exUserLg) setExcludeUser(!!d.toggleOn);
      else if(el === exAiLg) setExcludeAi(!!d.toggleOn);
    }
  });

  /* 页面 → 玻璃（播放进度实时同步滑块） */
  function syncSeek(){
    if(!seekLg || seekProg || !audio.duration) return;
    var p = Math.min(100, Math.max(0, (audio.currentTime / audio.duration) * 100));
    try { seekLg.setState({ sliderValue: p }); } catch(e){}
  }

  /* 背景绑定：所有液态玻璃控件都必须有折射目标，否则一片黑（库的 wallpaper 机制）。
     必须在渲染器就绪前就设置好，否则会被当作无效背景丢弃 */
  function bindWallpaper(){
    document.querySelectorAll("liquid-glass").forEach(function(el){
      try { el.setAttribute("wallpaper", LG_WALLPAPER); } catch(e){}
    });
  }
  bindWallpaper();

  /* 玻璃按钮组（GooseHyperGlass buttons 模式）。关键：渲染器是异步就绪的，
     setButtons 必须延迟到渲染器启动后再调用（双 rAF），否则被吞掉，
     玻璃会变成无交互的透明覆盖层拦截底层按钮点击 —— 与 MJ 播放器 initSendGlass 一致 */
  var BTN_IDS = ["prevLg","playLg","nextLg","searchLg","sendLg"];
  var cfgTries = 0;
  function cfgButtons(){
    var conf = {
      prevLg:   [{ id:"prev",   label:"", style:"surface" }],
      playLg:   [{ id:"play",   label:"", style:"transparent" }],
      nextLg:   [{ id:"next",   label:"", style:"surface" }],
      searchLg: [{ id:"search", label:"", style:"surface" }],
      sendLg:   [{ id:"send",   label:"", style:"blue" }]
    };
    var okAll = true;
    BTN_IDS.forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      try { el.setButtons(conf[id]); } catch(e){ okAll = false; }
    });
    cfgTries++;
    /* 渲染器就绪标志：liquid-glass 内部出现 canvas */
    var ready = document.querySelectorAll("liquid-glass canvas").length > 0;
    if(!ready && cfgTries < 30){ setTimeout(cfgButtons, 120); return; }
    if(!ready){
      /* 兜底：玻璃按钮始终没生效 —— 让点击穿透到底层普通按钮（#doSearch 等） */
      BTN_IDS.forEach(function(id){
        var el = document.getElementById(id);
        if(el) el.style.pointerEvents = "none";
      });
    }
  }
  requestAnimationFrame(function(){ requestAnimationFrame(cfgButtons); });

  /* 玻璃按钮点击：用 e.target.id 判断（与 MJ 播放器 lg-buttontap 一致，不依赖 detail 结构） */
  document.addEventListener("lg-buttontap", function(e){
    var el = e.target;
    if(!el) return;
    var eid = el.id || "";
    var bid = e.detail && e.detail.id;
    if(eid === "sendLg" && bid === "send") sendChat();
    else if(eid === "prevLg" && bid === "prev") notice("一首一首播，播完才轮到下一位");
    else if(eid === "playLg" && bid === "play") { if(currentIdx >= 0){ if(audio.paused) audio.play(); else audio.pause(); } }
    else if(eid === "nextLg" && bid === "next") nextTurn();
    else if(eid === "searchLg" && bid === "search") doSearch();
  });
})();
</script>
</body>
</html>
