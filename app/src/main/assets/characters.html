<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的伴侣</title>
<style>
  :root {
    --bg0:#eef1f8; --bg1:#f7f8fc;
    --ink:#1c2233; --ink-dim:#67718a;
    --card: rgba(255,255,255,.72);
    --stroke: rgba(255,255,255,.9);
    --accent:#3f6fd6; --accent2:#7b5cff; --pink:#c44ad6;
    --r-lg:22px; --r-md:16px;
    --shadow: 0 12px 32px rgba(63,80,140,.16);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
    -webkit-user-select:none; user-select:none; letter-spacing:.1px;
  }
  #bg {
    position: fixed; inset:0; z-index:-2;
    background:
      radial-gradient(680px 520px at 88% -8%, rgba(120,160,255,.5), transparent 68%),
      radial-gradient(600px 460px at -12% 26%, rgba(200,170,255,.42), transparent 70%),
      radial-gradient(520px 420px at 100% 88%, rgba(255,190,225,.4), transparent 72%),
      radial-gradient(480px 380px at 12% 100%, rgba(160,225,255,.4), transparent 70%),
      linear-gradient(168deg, var(--bg1) 0%, var(--bg0) 52%, #e9edf7 100%);
  }
  #bgLight {
    position: fixed; inset:0; z-index:-1; opacity:.34;
    background-size: cover; background-position: center;
  }
  #charsLg {
    position: fixed; inset:0; width:100%; height:calc(100% + 56px);
    margin-top:-56px;
  }
  /* ===== WebGL2 不支持时的降级：原生平面卡片列表 ===== */
  html.no-lg2 #charsLg { display:none; }
  #fb {
    position:fixed; inset:0; overflow-y:auto; padding:18px 16px 34px;
    display:none; flex-direction:column; gap:14px;
  }
  html.no-lg2 #fb { display:flex; }
  .fb-card {
    background: var(--card); border:1px solid var(--stroke);
    border-radius:var(--r-lg); padding:18px 16px; box-shadow: var(--shadow);
  }
  .fb-name { font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .fb-tag { font-size:12.5px; color:var(--ink-dim); margin-top:6px; line-height:1.5; }
  .fb-btn {
    margin-top:12px; align-self:flex-start; cursor:pointer;
    font-size:13px; font-weight:700; color:#fff; border:none; border-radius:999px;
    padding:8px 18px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 6px 14px rgba(90,110,255,.28);
  }
  .fb-btn:active { transform:scale(.96); }
  .fb-empty { color:var(--ink-dim); font-size:14px; text-align:center; margin-top:40vh; }
</style>
</head>
<body>
<!-- WebGL2 探测：支持才加载 GooseHyperGlass 液态玻璃库，否则原生降级 -->
<script>
  (function () {
    var ok = false;
    try { ok = !!(window.WebGL2RenderingContext && document.createElement('canvas').getContext('webgl2')); }
    catch (e) { ok = false; }
    window.__lgOk = ok;
    if (!ok) document.documentElement.classList.add('no-lg2');
    else document.write('<script src="goose-glass.js"><\/script>');
  })();
</script>

<div id="bg"></div>
<div id="bgLight"></div>

<liquid-glass id="charsLg" mode="lazy-scroll-container" dpr="1.2"></liquid-glass>

var bgLight = document.getElementById("bgLight");
if (bgLight) bgLight.style.backgroundImage = "url(" + LG_WALLPAPER + ")";

var bridge = window.CharacterBridge || {};
function openChat(href){ if(bridge.openChat) bridge.openChat(href); }

var chars = [];
function renderFb(list){
  var fb = document.getElementById("fb");
  fb.innerHTML = "";
  if(!list || !list.length){
    fb.innerHTML = '<div class="fb-empty">还没有角色<br>点右上角 + 创建</div>';
    return;
  }
  list.forEach(function(c){
    var d = document.createElement("div");
    d.className = "fb-card";
    d.innerHTML = '<div class="fb-name">' + esc(c.name) +
      (c.active ? '<span style="font-size:11px;color:#3f6fd6;font-weight:600">● 聊天中</span>' : '') +
      '</div><div class="fb-tag">' + esc(c.tagline || "") + '</div>' +
      '<button class="fb-btn">' + (c.active ? "聊天中" : "聊天") + '</button>';
    d.querySelector(".fb-btn").onclick = function(){ openChat("chat:" + c.id); };
    fb.appendChild(d);
  });
}
function esc(s){ var t=document.createElement("div"); t.textContent = s==null?"":String(s); return t.innerHTML; }

fetch("/api/characters").then(function(r){ return r.json(); }).then(function(data){
  // 兼容两种返回：{list:[...]} 或裸数组 [...]
  var raw = (data && data.list) || data;
  chars = Array.isArray(raw) ? raw : [];
  renderFb(chars);
  if(!chars.length){
    document.querySelector("#charsLg") && document.querySelector("#charsLg").setAttribute("mode","buttons");
    return;
  }
  if (window.__lgOk !== true) return;
  var lg = document.getElementById("charsLg");
  if(!lg) return;
  var config = chars.map(function(c, i){
    return {
      title: c.name,
      subtitle: (c.active ? "● 聊天中 · " : "") + (c.tagline || "AI 伴侣"),
      link: { text: c.active ? "聊天中" : "聊天", href: "chat:" + c.id }
    };
  });
  var applied = false;
  function applyScroll(){
    if (applied) return;
    try {
      lg.setAttribute("wallpaper", LG_WALLPAPER);
      lg.setScroll(config);
      // 库渲染器未就绪时 setScroll 会被吞掉，轮询重试直到生效
      if (!lg._renderer) { setTimeout(applyScroll, 150); return; }
      applied = true;
    } catch(e){ applied = true; }
  }
  applyScroll();
}).catch(function(e){
  var lg = document.querySelector("#charsLg");
  if (lg) lg.setAttribute("mode","buttons");
});

/* 点击玻璃卡片链接 → 打开聊天 */
document.addEventListener("lg-linktap", function(e){
  var href = e.detail && e.detail.href;
  if (href) openChat(href);
});
</script>
</body>
</html>
